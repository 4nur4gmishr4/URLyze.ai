<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="URLyze AI — turn any URL into an executive summary, study notes, and a slide outline."
		/>
		<!-- Apply theme before first paint to prevent flash of unstyled content (FOUC).
		     Read once, from localStorage; fall back to the OS preference. -->
		<script nonce="%sveltekit.nonce%">
			(function () {
				try {
					var stored = localStorage.getItem('urlyze-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
