<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>URLyze AI</title>
		<meta
			name="description"
			content="URLyze AI turns any URL into an executive summary, study notes, and a slide outline."
		/>
		<meta name="robots" content="index, follow" />
		<!-- Open Graph / social sharing. Swap the domain for the live deploy URL. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="URLyze AI" />
		<meta
			property="og:title"
			content="URLyze AI. One URL in, three ways out."
		/>
		<meta
			property="og:description"
			content="Paste an article or a YouTube video. Gemini distills it into an executive sketch, study notes, and a slide outline, ready to read or download."
		/>
		<meta property="og:url" content="https://urlyze.ai" />
		<meta name="twitter:card" content="summary" />
		<!-- Apply theme before first paint to prevent flash of unstyled content (FOUC).
		     Read once, from localStorage; fall back to the OS preference. -->
		<script nonce="%sveltekit.nonce%">
			(function () {
				try {
					var stored = localStorage.getItem('urlyze-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
